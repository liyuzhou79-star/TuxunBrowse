name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report APK size
        run: |
          ls -la app/build/outputs/apk/debug/
          stat -c "%s %n" app/build/outputs/apk/debug/*.apk

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -5
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "certificate SHA-256 digest" | awk '{print $NF}')
          EXPECTED="98afacf98df5213669492b4a295d8a82f9a372cba06c2f3214938a8de9a900f3"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Test signing pin did not take effect"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxunbrowse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
